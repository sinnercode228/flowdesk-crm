# Full stack: PostgreSQL + Fastify API + static web client (real API mode).
#   echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)" > .env   # once; .env is gitignored
#   docker compose up --build
#   web  -> http://localhost:3000   (demo accounts are prefilled on the login page)
#   api  -> http://localhost:4000/api, Swagger UI -> http://localhost:4000/docs
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk
      POSTGRES_DB: flowdesk
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowdesk']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://flowdesk:flowdesk@db:5432/flowdesk?schema=public
      # No fallback: the API runs with NODE_ENV=production and refuses weak or published secrets.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET, e.g. in .env next to this file (openssl rand -base64 48)}
      # The browser talks to the API directly on port 4000, with no proxy in front, so
      # X-Forwarded-For must not be trusted. Set it to the proxy's address if you add one.
      TRUST_PROXY: 'false'
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: http
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  db-data:
